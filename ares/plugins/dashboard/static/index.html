<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARES Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fff;
            --text: #000;
            --border: #ddd;
            --tab-active: #0066cc;
            --tab-inactive: #666;
            --error: #cc0000;
            --success: #00aa00;
            --button-bg: #f0f0f0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --text: #e0e0e0;
                --border: #444;
                --tab-active: #66b3ff;
                --tab-inactive: #999;
                --error: #ff6666;
                --success: #66ff66;
                --button-bg: #333;
            }
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .token-section {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }

        .token-section input {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            flex: 1;
            max-width: 400px;
            background: var(--bg);
            color: var(--text);
        }

        .token-section button {
            padding: 8px 16px;
            background: var(--button-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            color: var(--text);
        }

        .token-section button:hover {
            background: var(--tab-active);
            color: #fff;
        }

        .health-status {
            font-size: 0.9em;
            color: var(--tab-inactive);
        }

        .status-ok {
            color: var(--success);
        }

        .status-error {
            color: var(--error);
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
            gap: 0;
        }

        .tab-button {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--tab-inactive);
            cursor: pointer;
            font-size: 1em;
            transition: all 0.2s;
        }

        .tab-button:hover {
            color: var(--tab-active);
        }

        .tab-button.active {
            color: var(--tab-active);
            border-bottom-color: var(--tab-active);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            height: 600px;
            gap: 10px;
        }

        .chat-messages {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow-y: auto;
            padding: 15px;
            background: var(--bg);
        }

        .message {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 4px;
            word-wrap: break-word;
        }

        .message.user {
            background: var(--tab-active);
            color: #fff;
            margin-left: 40px;
            text-align: right;
        }

        .message.assistant {
            background: var(--button-bg);
            margin-right: 40px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text);
        }

        .chat-input button {
            padding: 10px 20px;
            background: var(--tab-active);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .chat-input button:hover {
            opacity: 0.9;
        }

        .memory-container {
            display: flex;
            gap: 20px;
            height: 600px;
        }

        .memory-list {
            flex: 0 0 250px;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow-y: auto;
            padding: 10px;
        }

        .memory-list button {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            background: var(--button-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            text-align: left;
            color: var(--text);
        }

        .memory-list button:hover {
            background: var(--tab-active);
            color: white;
        }

        .memory-search {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .memory-search input {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg);
            color: var(--text);
        }

        .memory-content {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow-y: auto;
            padding: 15px;
            background: var(--bg);
        }

        .memory-content pre {
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .tasks-table, .approvals-table, .prs-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--border);
        }

        .tasks-table th, .approvals-table th, .prs-table th {
            background: var(--button-bg);
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .tasks-table td, .approvals-table td, .prs-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .tasks-table tr:hover, .approvals-table tr:hover, .prs-table tr:hover {
            background: var(--button-bg);
        }

        .approval-buttons {
            display: flex;
            gap: 5px;
        }

        .approval-buttons button {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .approve-btn {
            background: var(--success);
            color: white;
        }

        .approve-btn:hover {
            opacity: 0.9;
        }

        .deny-btn {
            background: var(--error);
            color: white;
        }

        .deny-btn:hover {
            opacity: 0.9;
        }

        .prs-table a {
            color: var(--tab-active);
            text-decoration: none;
        }

        .prs-table a:hover {
            text-decoration: underline;
        }

        .tab-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tab-section button {
            padding: 8px 16px;
            background: var(--button-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            color: var(--text);
        }

        .tab-section button:hover {
            background: var(--tab-active);
            color: white;
        }

        .error-message {
            background: var(--error);
            color: white;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading {
            color: var(--tab-inactive);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="token-section">
            <input type="password" id="tokenInput" placeholder="Paste dashboard token here" autocomplete="off">
            <button id="setTokenBtn">Set Token</button>
            <div class="health-status" id="healthStatus">Status: <span class="loading">loading...</span></div>
        </div>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <div class="tabs">
        <button class="tab-button active" data-tab="chat">Chat</button>
        <button class="tab-button" data-tab="memory">Memory</button>
        <button class="tab-button" data-tab="tasks">Tasks</button>
        <button class="tab-button" data-tab="approvals">Approvals</button>
        <button class="tab-button" data-tab="prs">PRs</button>
    </div>

    <div id="chat" class="tab-content active">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type a message..." autocomplete="off">
                <button id="chatSendBtn">Send</button>
            </div>
        </div>
    </div>

    <div id="memory" class="tab-content">
        <div class="tab-section">
            <button id="memoryRefreshBtn">Refresh List</button>
        </div>
        <div class="memory-container">
            <div class="memory-list" id="memoryList"></div>
            <div class="memory-content" id="memoryContent"><div class="loading">Select a file to view</div></div>
        </div>
    </div>

    <div id="tasks" class="tab-content">
        <div class="tab-section">
            <button id="tasksRefreshBtn">Refresh</button>
        </div>
        <div id="tasksContainer"></div>
    </div>

    <div id="approvals" class="tab-content">
        <div class="tab-section">
            <button id="approvalsRefreshBtn">Refresh</button>
        </div>
        <div id="approvalsContainer"></div>
    </div>

    <div id="prs" class="tab-content">
        <div class="tab-section">
            <button id="prsRefreshBtn">Refresh</button>
        </div>
        <div id="prsContainer"></div>
    </div>

    <script>
        let token = null;
        let pollLoopRunning = false;
        let lastMessageId = 0;

        // Fetch helper with Authorization header
        async function apiFetch(url, options = {}) {
            if (!token) {
                showError('No token set. Paste the dashboard token and click Set Token.');
                throw new Error('No token');
            }

            const headers = {
                ...options.headers,
                'Authorization': `Bearer ${token}`
            };

            try {
                const response = await fetch(url, {
                    ...options,
                    headers
                });

                if (response.status === 401) {
                    showError('Unauthorized — check token');
                    token = null;
                    throw new Error('Unauthorized');
                }

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                return response;
            } catch (err) {
                showError(`API Error: ${err.message}`);
                throw err;
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        // Tab switching
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                const tabId = e.target.getAttribute('data-tab');
                document.getElementById(tabId).classList.add('active');

                if (tabId === 'chat' && !pollLoopRunning) {
                    startChatPoll();
                }
            });
        });

        // Token management
        document.getElementById('setTokenBtn').addEventListener('click', () => {
            const input = document.getElementById('tokenInput');
            token = input.value.trim();
            if (token) {
                input.value = '';
                showError('Token set! ✓');
                checkHealth();
            } else {
                showError('Please enter a token');
            }
        });

        // Prevent enter key auto-submit in token field
        document.getElementById('tokenInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('setTokenBtn').click();
            }
        });

        // Health check
        async function checkHealth() {
            try {
                const response = await apiFetch('/api/health');
                const data = await response.json();
                const statusDiv = document.getElementById('healthStatus');
                if (data.ok) {
                    statusDiv.innerHTML = `Status: <span class="status-ok">OK (uptime: ${data.uptime}s)</span>`;
                } else {
                    statusDiv.innerHTML = `Status: <span class="status-error">Error</span>`;
                }
            } catch (err) {
                document.getElementById('healthStatus').innerHTML = `Status: <span class="status-error">Error</span>`;
            }
        }

        // Chat functionality
        document.getElementById('chatSendBtn').addEventListener('click', sendChat);
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendChat();
            }
        });

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            addChatMessage(text, 'user');
            input.value = '';

            try {
                await apiFetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text })
                });
            } catch (err) {
                // Error already shown by apiFetch
            }
        }

        function addChatMessage(text, role) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Chat long-poll
        function startChatPoll() {
            if (pollLoopRunning) return;
            pollLoopRunning = true;
            chatPollLoop();
        }

        async function chatPollLoop() {
            while (pollLoopRunning) {
                try {
                    const response = await apiFetch(`/api/chat/poll?since=${lastMessageId}`);
                    const data = await response.json();

                    if (data.messages && data.messages.length > 0) {
                        data.messages.forEach(msg => {
                            addChatMessage(msg.text || msg, 'assistant');
                            lastMessageId = msg.id || lastMessageId + 1;
                        });
                    }
                } catch (err) {
                    // Continue polling even on error
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    continue;
                }

                // Poll again immediately if we got messages, otherwise wait a bit
                await new Promise(resolve => setTimeout(resolve, 100));
            }
        }

        // Memory tab
        document.getElementById('memoryRefreshBtn').addEventListener('click', refreshMemoryList);

        async function refreshMemoryList() {
            try {
                const response = await apiFetch('/api/memory/list');
                const text = await response.text();
                const memoryList = document.getElementById('memoryList');
                memoryList.innerHTML = '';

                const lines = text.split('\n').filter(l => l.trim());
                lines.forEach(line => {
                    const btn = document.createElement('button');
                    btn.textContent = line;
                    btn.addEventListener('click', () => viewMemoryFile(line));
                    memoryList.appendChild(btn);
                });
            } catch (err) {
                // Error already shown
            }
        }

        async function viewMemoryFile(path) {
            try {
                const response = await apiFetch(`/api/memory/file?path=${encodeURIComponent(path)}`);
                const text = await response.text();
                const contentDiv = document.getElementById('memoryContent');
                contentDiv.innerHTML = `<pre>${escapeHtml(text)}</pre>`;
            } catch (err) {
                // Error already shown
            }
        }

        // Tasks tab
        document.getElementById('tasksRefreshBtn').addEventListener('click', refreshTasks);

        async function refreshTasks() {
            try {
                const response = await apiFetch('/api/tasks?status=open');
                const tasks = await response.json();
                const container = document.getElementById('tasksContainer');

                if (!tasks || tasks.length === 0) {
                    container.innerHTML = '<p>No open tasks</p>';
                    return;
                }

                let html = '<table class="tasks-table"><thead><tr><th>ID</th><th>Type</th><th>Title</th><th>Status</th><th>Due At</th></tr></thead><tbody>';
                tasks.forEach(task => {
                    html += `<tr>
                        <td>${escapeHtml(String(task.id))}</td>
                        <td>${escapeHtml(task.type || '')}</td>
                        <td>${escapeHtml(task.title || '')}</td>
                        <td>${escapeHtml(task.status || '')}</td>
                        <td>${escapeHtml(task.due_at || '')}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (err) {
                // Error already shown
            }
        }

        // Approvals tab
        document.getElementById('approvalsRefreshBtn').addEventListener('click', refreshApprovals);

        async function refreshApprovals() {
            try {
                const response = await apiFetch('/api/privileges?status=pending');
                const requests = await response.json();
                const container = document.getElementById('approvalsContainer');

                if (!requests || requests.length === 0) {
                    container.innerHTML = '<p>No pending requests</p>';
                    return;
                }

                let html = '<table class="approvals-table"><thead><tr><th>ID</th><th>Kind</th><th>Command</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
                requests.forEach(req => {
                    html += `<tr>
                        <td>${escapeHtml(String(req.id))}</td>
                        <td>${escapeHtml(req.kind || '')}</td>
                        <td><code>${escapeHtml(req.command || '')}</code></td>
                        <td>${escapeHtml(req.reason || '')}</td>
                        <td>${escapeHtml(req.status || '')}</td>
                        <td>
                            <div class="approval-buttons">
                                <button class="approve-btn" onclick="approveRequest('${escapeHtml(String(req.id))}')">Approve</button>
                                <button class="deny-btn" onclick="denyRequest('${escapeHtml(String(req.id))}')">Deny</button>
                            </div>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (err) {
                // Error already shown
            }
        }

        async function approveRequest(id) {
            try {
                await apiFetch(`/api/privileges/${id}/approve`, { method: 'POST' });
                showError('Request approved ✓');
                refreshApprovals();
            } catch (err) {
                // Error already shown
            }
        }

        async function denyRequest(id) {
            try {
                await apiFetch(`/api/privileges/${id}/deny`, { method: 'POST' });
                showError('Request denied ✓');
                refreshApprovals();
            } catch (err) {
                // Error already shown
            }
        }

        // PRs tab
        document.getElementById('prsRefreshBtn').addEventListener('click', refreshPRs);

        async function refreshPRs() {
            try {
                const response = await apiFetch('/api/prs');
                const prs = await response.json();
                const container = document.getElementById('prsContainer');

                if (!prs || prs.length === 0) {
                    container.innerHTML = '<p>No open PRs</p>';
                    return;
                }

                let html = '<table class="prs-table"><thead><tr><th>Number</th><th>Title</th><th>State</th><th>Link</th></tr></thead><tbody>';
                prs.forEach(pr => {
                    const link = pr.url ? `<a href="${escapeHtml(pr.url)}" target="_blank">View on GitHub</a>` : '-';
                    html += `<tr>
                        <td>${escapeHtml(String(pr.number || ''))}</td>
                        <td>${escapeHtml(pr.title || '')}</td>
                        <td>${escapeHtml(pr.state || '')}</td>
                        <td>${link}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (err) {
                // Error already shown
            }
        }

        // Utility
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Start chat poll when page loads if we have a token
        window.addEventListener('load', () => {
            if (token) {
                startChatPoll();
                checkHealth();
            }
        });

        // Stop poll when unloading
        window.addEventListener('beforeunload', () => {
            pollLoopRunning = false;
        });
    </script>
</body>
</html>
