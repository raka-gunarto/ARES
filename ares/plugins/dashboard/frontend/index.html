<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARES</title>
<style>
:root{
  --bg:#070709; --bg2:#0d0d11; --bg3:#131319;
  --line:#2a0f12; --line2:#3d151b;
  --red:#ff0000; --red-soft:#ff3b3b;
  --burg:#a30000; --burg2:#8b0000;
  --amber:#ffa500; --amber2:#ff7f00;
  --teal:#00ffff; --teal2:#00ced1;
  --dim:#330000;
  --txt:#e8e8ee; --muted:#8b8b95; --muted2:#55555f;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--mono);
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(139,0,0,.18), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(0,206,209,.06), transparent 55%),
    var(--bg);
  color:var(--txt); font-size:14px; line-height:1.5;
  min-height:100%;
}
::selection{background:rgba(255,0,0,.35);color:#fff}
/* scrollbars */
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:linear-gradient(var(--burg2),var(--dim));border-radius:6px;border:2px solid var(--bg)}
*::-webkit-scrollbar-thumb:hover{background:var(--red)}
*{scrollbar-color:var(--burg2) transparent;scrollbar-width:thin}

.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}

/* ---- header ---- */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
.brand{display:flex;align-items:baseline;gap:14px}
.logo{
  font-weight:800;font-size:30px;letter-spacing:.42em;color:var(--red);
  text-shadow:0 0 8px rgba(255,0,0,.75),0 0 22px rgba(255,0,0,.45);
  padding-left:.42em;
}
.logo b{color:var(--teal);text-shadow:0 0 8px rgba(0,255,255,.7)}
.tagline{color:var(--muted2);font-size:11px;letter-spacing:.28em;text-transform:uppercase}
.hmeta{display:flex;align-items:center;gap:12px}
.ver{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;
  letter-spacing:.04em;color:var(--muted2);white-space:nowrap;cursor:default}

.pill{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;
  padding:6px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--bg2);
  color:var(--muted);white-space:nowrap;
}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted2)}
.pill.ok{color:var(--teal2);border-color:rgba(0,206,209,.4)}
.pill.ok .dot{background:var(--teal);box-shadow:0 0 8px var(--teal)}
.pill.bad{color:var(--red-soft);border-color:rgba(255,0,0,.4)}
.pill.bad .dot{background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}

.rule{height:1px;margin:16px 0 18px;background:linear-gradient(90deg,var(--red),var(--burg2) 30%,transparent 75%);
  box-shadow:0 0 10px rgba(255,0,0,.35)}

/* ---- token bar ---- */
.tokenbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.tokenbar.locked{border-color:rgba(255,0,0,.5);box-shadow:0 0 0 1px rgba(255,0,0,.15),0 0 24px rgba(255,0,0,.12)}
.tokenbar label{color:var(--muted);font-size:12px;letter-spacing:.05em;white-space:nowrap}
input,textarea{font-family:var(--mono);font-size:13px}
.field{
  flex:1;min-width:180px;padding:9px 12px;background:#050506;color:var(--txt);
  border:1px solid var(--line2);border-radius:7px;outline:none;transition:.15s;
}
.field:focus{border-color:var(--red);box-shadow:0 0 0 1px var(--red),0 0 14px rgba(255,0,0,.3)}
.btn{
  padding:9px 16px;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:13px;
  background:var(--bg3);color:var(--txt);border:1px solid var(--line2);transition:.15s;letter-spacing:.03em;
}
.btn:hover{border-color:var(--red);color:#fff;box-shadow:0 0 14px rgba(255,0,0,.3)}
.btn.primary{border-color:var(--burg);color:var(--red-soft)}
.btn.primary:hover{background:var(--red);color:#000;box-shadow:0 0 18px rgba(255,0,0,.5)}
.btn.teal:hover{border-color:var(--teal2);color:var(--teal);box-shadow:0 0 14px rgba(0,206,209,.35)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--teal);box-shadow:none}
.btn.sm{padding:6px 12px;font-size:12px}

/* ---- tabs ---- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin-bottom:20px;flex-wrap:wrap}
.tab{
  padding:11px 18px;background:transparent;border:none;border-bottom:2px solid transparent;
  color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:13px;letter-spacing:.08em;
  text-transform:uppercase;transition:.15s;margin-bottom:-1px;
}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--red);border-bottom-color:var(--red);text-shadow:0 0 10px rgba(255,0,0,.6)}
.tab .badge{margin-left:8px;font-size:10px;background:var(--amber2);color:#000;border-radius:999px;padding:1px 7px;letter-spacing:0}

/* ---- panels ---- */
.panel{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.panel-hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);
  color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.section-actions{display:flex;gap:8px;align-items:center}

.empty{color:var(--muted2);font-style:italic;padding:26px;text-align:center}

/* ---- trace ---- */
.tr-count{color:var(--muted2);font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace}
.trace{height:min(66vh,660px);overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.trow{border:1px solid var(--line);border-left:3px solid var(--muted2);border-radius:7px;
  background:var(--bg);padding:7px 10px}
.trow.k-event{border-left-color:var(--teal2)}
.trow.k-reply{border-left-color:var(--amber)}
.trow.k-tool{border-left-color:var(--burg)}
.trow.k-final{border-left-color:var(--red)}
.trow.k-error{border-left-color:var(--red);background:rgba(255,0,0,.06)}
.tr-hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tr-tag{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.k-event .tr-tag{color:var(--teal2)} .k-reply .tr-tag{color:var(--amber)}
.k-tool .tr-tag{color:var(--red-soft)} .k-final .tr-tag{color:var(--red)} .k-error .tr-tag{color:var(--red)}
.tr-ts{font-size:10.5px;color:var(--muted2);font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.tr-body{margin:5px 0 0;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12px;line-height:1.5;color:var(--txt);max-height:240px;overflow:auto}
.tr-body.think{color:var(--muted);font-style:italic;border-left:2px solid var(--line2);padding-left:8px}
.tr-lbl{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);font-style:normal;margin-bottom:2px}
.tr-tools{margin-top:5px;display:flex;flex-direction:column;gap:4px}
.tr-call{font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--amber2)}
.tr-call b{color:var(--amber)} .tr-call code{color:var(--muted);margin-left:6px;word-break:break-all}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;
  padding:11px 18px;border-radius:9px;font-size:13px;background:var(--bg3);border:1px solid var(--line2);
  box-shadow:0 8px 30px rgba(0,0,0,.6)}
.toast.err{border-color:var(--red);color:var(--red-soft);box-shadow:0 0 22px rgba(255,0,0,.3)}
.toast.ok{border-color:var(--teal2);color:var(--teal);box-shadow:0 0 22px rgba(0,206,209,.25)}

/* ---- chat ---- */
.chat{display:flex;flex-direction:column;height:min(64vh,620px)}
.stream{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:74%;padding:11px 14px;border-radius:12px;white-space:pre-wrap;word-break:break-word;font-size:13.5px}
.bubble.me{align-self:flex-end;background:rgba(0,206,209,.08);border:1px solid rgba(0,206,209,.4);
  color:#c9fbff;border-bottom-right-radius:3px}
.bubble.ares{align-self:flex-start;background:rgba(255,0,0,.06);border:1px solid rgba(255,0,0,.35);
  border-bottom-left-radius:3px}
.who{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);margin:0 4px 3px}
.me .who{text-align:right}
.composer{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}

/* ---- memory ---- */
.mem{display:grid;grid-template-columns:280px 1fr;min-height:min(64vh,620px)}
.mem-list{border-right:1px solid var(--line);overflow-y:auto;max-height:min(64vh,620px)}
.mem-item{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:11px 14px;
  background:transparent;border:none;border-bottom:1px solid var(--line);color:var(--txt);cursor:pointer;
  font-family:var(--mono);transition:.12s}
.mem-item:hover{background:rgba(255,0,0,.06)}
.mem-item.active{background:rgba(255,0,0,.1);box-shadow:inset 3px 0 0 var(--red)}
.mem-name{font-size:13px;word-break:break-all}
.mem-size{font-size:10px;color:var(--muted2);letter-spacing:.05em}
.mem-view{padding:20px 24px;overflow-y:auto;max-height:min(64vh,620px)}
.fm{display:flex;flex-wrap:wrap;gap:8px 18px;padding:12px 14px;margin-bottom:18px;background:#050506;
  border:1px solid var(--line2);border-radius:9px}
.fm div{font-size:12px}
.fm .k{color:var(--teal2);letter-spacing:.06em}
.fm .v{color:var(--txt)}

/* markdown */
.md{font-size:13.5px;color:var(--txt)}
.md h1,.md h2,.md h3{color:var(--red-soft);letter-spacing:.02em;margin:18px 0 8px;line-height:1.25;
  text-shadow:0 0 10px rgba(255,0,0,.25)}
.md h1{font-size:20px} .md h2{font-size:17px} .md h3{font-size:15px}
.md p{margin:8px 0}
.md ul{margin:8px 0 8px 20px} .md li{margin:3px 0}
.md a{color:var(--teal);text-decoration:none;border-bottom:1px dotted rgba(0,255,255,.4)}
.md a:hover{text-shadow:0 0 10px rgba(0,255,255,.5)}
.md code{background:#050506;border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--amber);font-size:12.5px}
.md pre{background:#050506;border:1px solid var(--line2);border-radius:8px;padding:12px 14px;overflow-x:auto;margin:10px 0}
.md pre code{background:none;border:none;padding:0;color:var(--txt)}
.md strong{color:#fff}
.md em{color:var(--amber)}
.md hr{border:none;height:1px;background:var(--line2);margin:14px 0}
.wikilink{color:var(--amber);border-bottom:1px dotted rgba(255,165,0,.5)}

/* ---- tables ---- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:11px 14px;color:var(--red-soft);border-bottom:1px solid var(--line2);
  text-transform:uppercase;font-size:11px;letter-spacing:.1em;font-weight:600}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,0,0,.045)}
td code{background:#050506;border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--amber);font-size:12px}
.state{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);letter-spacing:.05em}
.state.pending{color:var(--amber);border-color:rgba(255,165,0,.4)}
.state.open{color:var(--teal2);border-color:rgba(0,206,209,.4)}
.row-actions{display:flex;gap:6px}
a.ext{color:var(--teal);text-decoration:none;border-bottom:1px dotted rgba(0,255,255,.4)}
</style>
</head>
<body>
<div id="app"></div>

<script>/*__PREACT_STANDALONE__*/</script>
<script>
const { html, render, useState, useEffect, useRef } = window.htmPreact;
const TOKEN_KEY = "ares_token";

/* ---------------- markdown ---------------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function inlineMd(s){ // s already escaped
  return s
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\[\[([^\]]+)\]\]/g,'<span class="wikilink">[[$1]]</span>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
}
function parseDoc(src){
  let meta=null, body=src;
  if(src.slice(0,4)==="---\n" || src.slice(0,4)==="---\r"){
    const end=src.indexOf("\n---",3);
    if(end!==-1){
      const raw=src.slice(3,end);
      body=src.slice(end+4).replace(/^\s*\r?\n/,"");
      meta=[];
      raw.split(/\r?\n/).forEach(l=>{
        const m=l.match(/^([\w.-]+):\s*(.+)$/); // top-level keys only (skip indented/empty)
        if(m) meta.push([m[1],m[2].trim()]);
      });
    }
  }
  return {meta,body};
}
function renderMd(src){
  const lines=src.split(/\r?\n/); let out="",inList=false,inCode=false;
  const closeList=()=>{if(inList){out+="</ul>";inList=false;}};
  for(let raw of lines){
    if(/^```/.test(raw)){ if(!inCode){closeList();out+="<pre><code>";inCode=true;} else {out+="</code></pre>";inCode=false;} continue; }
    if(inCode){ out+=esc(raw)+"\n"; continue; }
    let m;
    if((m=raw.match(/^\s*(#{1,6})\s+(.*)$/))){ closeList(); const lv=m[1].length; out+=`<h${lv}>${inlineMd(esc(m[2]))}</h${lv}>`; }
    else if(/^\s*[-*]\s+/.test(raw)){ if(!inList){out+="<ul>";inList=true;} out+=`<li>${inlineMd(esc(raw.replace(/^\s*[-*]\s+/,"")))}</li>`; }
    else if(/^\s*---+\s*$/.test(raw)){ closeList(); out+="<hr/>"; }
    else if(raw.trim()===""){ closeList(); }
    else { closeList(); out+=`<p>${inlineMd(esc(raw))}</p>`; }
  }
  if(inCode) out+="</code></pre>"; closeList();
  return out;
}

/* ---------------- api ---------------- */
function makeApi(token, onUnauth){
  async function req(url,opts={}){
    const res=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:`Bearer ${token}`}});
    if(res.status===401){ onUnauth(); throw new Error("unauthorized"); }
    if(!res.ok) throw new Error("HTTP "+res.status);
    return res;
  }
  return {
    health:()=>req("/api/health").then(r=>r.json()),
    sendChat:(text)=>req("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})}),
    pollChat:()=>req("/api/chat/poll").then(r=>r.json()),
    memList:()=>req("/api/memory/list").then(r=>r.text()),
    memFile:(p)=>req("/api/memory/file?path="+encodeURIComponent(p)).then(r=>r.text()),
    tasks:()=>req("/api/tasks?status=open").then(r=>r.json()),
    privs:()=>req("/api/privileges?status=pending").then(r=>r.json()),
    approve:(id)=>req(`/api/privileges/${encodeURIComponent(id)}/approve`,{method:"POST"}).then(r=>r.json()),
    deny:(id)=>req(`/api/privileges/${encodeURIComponent(id)}/deny`,{method:"POST"}).then(r=>r.json()),
    prs:()=>req("/api/prs").then(r=>r.json()),
    trace:(offset)=>req("/api/trace"+(offset!=null?"?offset="+offset:"")).then(r=>r.json()),
  };
}

/* ---------------- chat ---------------- */
function Chat({messages,onSend}){
  const [text,setText]=useState("");
  const streamRef=useRef(null);
  useEffect(()=>{ if(streamRef.current) streamRef.current.scrollTop=streamRef.current.scrollHeight; },[messages]);
  const submit=()=>{ const t=text.trim(); if(!t) return; onSend(t); setText(""); };
  return html`
    <div class="panel">
      <div class="chat">
        <div class="stream" ref=${streamRef}>
          ${messages.length===0 && html`<div class="empty">No messages yet — say something to ARES.</div>`}
          ${messages.map((m,i)=>html`
            <div key=${i} class=${"bubble "+(m.role==="me"?"me":"ares")}>
              <div class="who">${m.role==="me"?"You":"ARES"}</div>${m.text}
            </div>`)}
        </div>
        <div class="composer">
          <input class="field" placeholder="Message ARES…" value=${text}
            onInput=${e=>setText(e.target.value)}
            onKeyDown=${e=>{if(e.key==="Enter"){e.preventDefault();submit();}}} />
          <button class="btn primary" onClick=${submit}>Send</button>
        </div>
      </div>
    </div>`;
}

/* ---------------- memory ---------------- */
function Memory({api,toast}){
  const [files,setFiles]=useState(null);
  const [sel,setSel]=useState(null);
  const [doc,setDoc]=useState(null);
  const load=async()=>{
    try{
      const txt=await api.memList();
      if(/^Memory is empty\.?/i.test(txt.trim())){ setFiles([]); return; }
      const list=txt.split(/\r?\n/).filter(l=>l.trim()).map(line=>{
        const m=line.match(/^(.*?)\s*\((\d+)\s*bytes?\)\s*$/); // strip the "(N bytes)" — THIS is the path the API wants
        return m?{path:m[1],size:+m[2]}:{path:line.trim(),size:null};
      });
      setFiles(list);
    }catch(e){ toast("Failed to list memory","err"); }
  };
  const open=async(f)=>{
    setSel(f.path); setDoc({loading:true});
    try{
      const txt=await api.memFile(f.path);
      if(/^error:/i.test(txt)){ setDoc({error:txt}); return; }
      setDoc(parseDoc(txt));
    }catch(e){ setDoc({error:"Failed to read file"}); }
  };
  useEffect(()=>{ load(); },[]);
  return html`
    <div class="panel">
      <div class="panel-hd">Memory<div class="section-actions"><button class="btn sm ghost" onClick=${load}>↻ Refresh</button></div></div>
      <div class="mem">
        <div class="mem-list">
          ${files===null && html`<div class="empty">Loading…</div>`}
          ${files && files.length===0 && html`<div class="empty">Memory is empty.</div>`}
          ${files && files.map(f=>html`
            <button key=${f.path} class=${"mem-item"+(sel===f.path?" active":"")} onClick=${()=>open(f)}>
              <span class="mem-name">${f.path}</span>
              ${f.size!==null && html`<span class="mem-size">${f.size} bytes</span>`}
            </button>`)}
        </div>
        <div class="mem-view">
          ${!doc && html`<div class="empty">Select a memory file to view.</div>`}
          ${doc && doc.loading && html`<div class="empty">Loading…</div>`}
          ${doc && doc.error && html`<div class="empty" style="color:var(--red-soft)">${doc.error}</div>`}
          ${doc && doc.body!==undefined && html`
            <div>
              ${doc.meta && doc.meta.length>0 && html`<div class="fm">${doc.meta.map(([k,v])=>html`<div key=${k}><span class="k">${k}</span> <span class="v">${v}</span></div>`)}</div>`}
              <div class="md" dangerouslySetInnerHTML=${{__html:renderMd(doc.body)}}></div>
            </div>`}
        </div>
      </div>
    </div>`;
}

/* ---------------- generic table tabs ---------------- */
function Tasks({api,toast}){
  const [rows,setRows]=useState(null);
  const load=async()=>{ try{ setRows(await api.tasks()); }catch(e){ toast("Failed to load tasks","err"); } };
  useEffect(()=>{ load(); },[]);
  return html`<div class="panel">
    <div class="panel-hd">Tasks<div class="section-actions"><button class="btn sm ghost" onClick=${load}>↻ Refresh</button></div></div>
    ${rows===null?html`<div class="empty">Loading…</div>`:
     rows.length===0?html`<div class="empty">No open tasks.</div>`:
     html`<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Type</th><th>Title</th><th>Status</th><th>Due</th></tr></thead>
       <tbody>${rows.map(t=>html`<tr key=${t.id}><td>${t.id}</td><td>${t.type||""}</td><td>${t.title||""}</td>
         <td><span class=${"state "+(t.status||"")}>${t.status||""}</span></td><td>${t.due_at||"—"}</td></tr>`)}</tbody></table></div>`}
  </div>`;
}
function Approvals({api,toast,onCount}){
  const [rows,setRows]=useState(null);
  const load=async()=>{ try{ const r=await api.privs(); setRows(r); onCount&&onCount(r.length); }catch(e){ toast("Failed to load approvals","err"); } };
  useEffect(()=>{ load(); },[]);
  const act=async(id,fn,word)=>{ try{ await fn(id); toast("Request "+word,"ok"); load(); }catch(e){ toast("Action failed","err"); } };
  return html`<div class="panel">
    <div class="panel-hd">Approvals<div class="section-actions"><button class="btn sm ghost" onClick=${load}>↻ Refresh</button></div></div>
    ${rows===null?html`<div class="empty">Loading…</div>`:
     rows.length===0?html`<div class="empty">No pending requests.</div>`:
     html`<div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Kind</th><th>Command</th><th>Reason</th><th></th></tr></thead>
       <tbody>${rows.map(r=>html`<tr key=${r.id}><td>${r.id}</td><td>${r.kind||""}</td>
         <td>${r.command?html`<code>${r.command}</code>`:""}</td><td>${r.reason||""}</td>
         <td><div class="row-actions">
           <button class="btn sm teal" onClick=${()=>act(r.id,api.approve,"approved")}>Approve</button>
           <button class="btn sm primary" onClick=${()=>act(r.id,api.deny,"denied")}>Deny</button>
         </div></td></tr>`)}</tbody></table></div>`}
  </div>`;
}
function PRs({api,toast}){
  const [rows,setRows]=useState(null);
  const load=async()=>{ try{ setRows(await api.prs()); }catch(e){ toast("Failed to load PRs","err"); } };
  useEffect(()=>{ load(); },[]);
  return html`<div class="panel">
    <div class="panel-hd">Self-edit PRs<div class="section-actions"><button class="btn sm ghost" onClick=${load}>↻ Refresh</button></div></div>
    ${rows===null?html`<div class="empty">Loading…</div>`:
     rows.length===0?html`<div class="empty">No open PRs.</div>`:
     html`<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Title</th><th>State</th><th>Link</th></tr></thead>
       <tbody>${rows.map(p=>html`<tr key=${p.number||p.url}><td>${p.number||""}</td><td>${p.title||""}</td>
         <td><span class=${"state "+(p.state||"")}>${p.state||""}</span></td>
         <td>${p.url?html`<a class="ext" href=${p.url} target="_blank" rel="noopener">GitHub ↗</a>`:"—"}</td></tr>`)}</tbody></table></div>`}
  </div>`;
}

/* ---------------- trace ---------------- */
function traceLabel(r){
  const k=r.kind;
  if(k==="event") return r.user_initiated?"YOU · "+(r.source||""):"EVENT · "+(r.source||"")+"/"+(r.type||"");
  if(k==="reply") return r.forced_final?"REPLY (forced)":"REPLY";
  if(k==="tool") return "TOOL · "+(r.name||"")+(r.ok===false?" ✗":"");
  if(k==="final") return "FINAL"+(r.spoke?" · spoke":r.notified?" · notified":" · silent");
  if(k==="error") return "ERROR";
  return (k||"?").toUpperCase();
}
function TraceRow({r}){
  const t=(r.ts||"").replace("T"," ").replace(/\..*/,"").slice(11);
  const tcs=(r.tool_calls||[]).filter(x=>x&&x.name);
  return html`<div class=${"trow k-"+(r.kind||"x")}>
    <div class="tr-hd"><span class="tr-tag">${traceLabel(r)}</span><span class="tr-ts">${t}</span></div>
    ${r.kind==="event" && r.text ? html`<pre class="tr-body">${r.text}</pre>`:null}
    ${r.kind==="reply" && r.thinking ? html`<pre class="tr-body think"><span class="tr-lbl">thinking</span>${r.thinking}</pre>`:null}
    ${r.kind==="reply" && r.content ? html`<pre class="tr-body">${r.content}</pre>`:null}
    ${r.kind==="reply" && tcs.length ? html`<div class="tr-tools">${tcs.map((c,i)=>html`<div class="tr-call" key=${i}><b>${c.name}</b>${c.arguments?html`<code>${typeof c.arguments==="string"?c.arguments:JSON.stringify(c.arguments)}</code>`:null}</div>`)}</div>`:null}
    ${r.kind==="tool" ? html`<pre class="tr-body">${(r.arguments?JSON.stringify(r.arguments):"")}${r.result?("\n→ "+r.result):""}</pre>`:null}
    ${r.kind==="final" && r.text ? html`<pre class="tr-body">${r.text}</pre>`:null}
    ${r.kind==="error" && r.error ? html`<pre class="tr-body">${r.error}</pre>`:null}
  </div>`;
}
function Trace({api,toast}){
  const [rows,setRows]=useState([]);
  const [live,setLive]=useState(true);
  const offRef=useRef(null);
  const boxRef=useRef(null);
  const stickRef=useRef(true);
  const liveRef=useRef(true); liveRef.current=live;
  useEffect(()=>{
    let alive=true;
    const tick=async()=>{
      if(!liveRef.current) return;
      try{
        const d=await api.trace(offRef.current);
        if(!alive) return;
        offRef.current=d.offset;
        if(d.records && d.records.length){
          setRows(r=>{ const n=r.concat(d.records); return n.length>4000?n.slice(n.length-4000):n; });
        }
      }catch(e){ /* transient; keep polling */ }
    };
    tick(); const id=setInterval(tick,1500);
    return ()=>{ alive=false; clearInterval(id); };
  },[]);
  useEffect(()=>{ if(stickRef.current && boxRef.current){ boxRef.current.scrollTop=boxRef.current.scrollHeight; } });
  const onScroll=e=>{ const el=e.target; stickRef.current = el.scrollHeight-el.scrollTop-el.clientHeight < 60; };
  return html`<div class="panel">
    <div class="panel-hd">Live trace
      <div class="section-actions">
        <span class="tr-count">${rows.length} records</span>
        <button class=${"btn sm "+(live?"primary":"ghost")} onClick=${()=>setLive(v=>!v)}>${live?"● Live":"▮ Paused"}</button>
        <button class="btn sm ghost" onClick=${()=>{setRows([]);}}>Clear view</button>
      </div>
    </div>
    <div class="trace" ref=${boxRef} onScroll=${onScroll}>
      ${rows.length===0?html`<div class="empty">Waiting for activity… everything ARES processes appears here as it happens.</div>`:
        rows.map((r,i)=>html`<${TraceRow} key=${i} r=${r}/>`)}
    </div>
  </div>`;
}

/* ---------------- app ---------------- */
const TABS=[["chat","Chat"],["trace","Trace"],["memory","Memory"],["tasks","Tasks"],["approvals","Approvals"],["prs","PRs"]];

function App(){
  const [token,setTok]=useState(()=>localStorage.getItem(TOKEN_KEY)||"");
  const [draft,setDraft]=useState("");
  const [tab,setTab]=useState("chat");
  const [health,setHealth]=useState(null); // null unknown, true ok, false bad
  const [messages,setMessages]=useState([]);
  const [toast,setToast]=useState(null);
  const [pendingCount,setPending]=useState(0);
  const [version,setVersion]=useState(null);
  const apiRef=useRef(null);

  // Deployed commit SHA (no auth; shows on the lock screen too).
  useEffect(()=>{ fetch("/api/version").then(r=>r.json()).then(v=>setVersion(v&&v.short)).catch(()=>{}); },[]);

  const showToast=(msg,kind)=>{ setToast({msg,kind}); clearTimeout(showToast._t); showToast._t=setTimeout(()=>setToast(null),3500); };
  const unauth=()=>{ localStorage.removeItem(TOKEN_KEY); setTok(""); setHealth(false); showToast("Unauthorized — check token","err"); };
  const api=(token?makeApi(token,unauth):null);
  apiRef.current=api;

  const saveToken=()=>{ const t=draft.trim(); if(!t){showToast("Enter a token","err");return;} localStorage.setItem(TOKEN_KEY,t); setTok(t); setDraft(""); showToast("Token saved","ok"); };
  const clearToken=()=>{ localStorage.removeItem(TOKEN_KEY); setTok(""); setHealth(null); setMessages([]); };

  // health poll
  useEffect(()=>{
    if(!token){ setHealth(null); return; }
    let alive=true;
    const tick=async()=>{ try{ const h=await apiRef.current.health(); if(alive) setHealth(!!h.ok); }catch(e){ if(alive) setHealth(false); } };
    tick(); const id=setInterval(tick,10000);
    return ()=>{ alive=false; clearInterval(id); };
  },[token]);

  // chat long-poll (runs whenever authed, regardless of active tab)
  useEffect(()=>{
    if(!token) return;
    let alive=true;
    (async()=>{
      while(alive){
        try{
          const data=await apiRef.current.pollChat();
          if(!alive) break;
          if(data.messages && data.messages.length){
            setMessages(m=>[...m,...data.messages.map(x=>({role:"ares",text:(x&&x.text)||x}))]);
          }
        }catch(e){ if(!alive) break; await new Promise(r=>setTimeout(r,1500)); }
      }
    })();
    return ()=>{ alive=false; };
  },[token]);

  const send=async(text)=>{
    setMessages(m=>[...m,{role:"me",text}]);
    try{ await apiRef.current.sendChat(text); }catch(e){ showToast("Send failed","err"); }
  };

  // locked (no token) view
  if(!token){
    return html`
      <div class="wrap">
        ${Header(health,pendingCount,version)}
        <div class="rule"></div>
        <div class="tokenbar locked">
          <label>DASHBOARD TOKEN</label>
          <input class="field" type="password" placeholder="Paste dashboard token…" value=${draft}
            onInput=${e=>setDraft(e.target.value)} onKeyDown=${e=>{if(e.key==="Enter")saveToken();}} autoFocus />
          <button class="btn primary" onClick=${saveToken}>Unlock</button>
        </div>
        <div class="empty">Enter the dashboard token to connect. It's stored in this browser so you won't be asked again.</div>
        ${toast && html`<div class=${"toast "+toast.kind}>${toast.msg}</div>`}
      </div>`;
  }

  const panel = tab==="chat"?html`<${Chat} messages=${messages} onSend=${send}/>`
    : tab==="trace"?html`<${Trace} api=${api} toast=${showToast}/>`
    : tab==="memory"?html`<${Memory} api=${api} toast=${showToast}/>`
    : tab==="tasks"?html`<${Tasks} api=${api} toast=${showToast}/>`
    : tab==="approvals"?html`<${Approvals} api=${api} toast=${showToast} onCount=${setPending}/>`
    : html`<${PRs} api=${api} toast=${showToast}/>`;

  return html`
    <div class="wrap">
      ${Header(health,pendingCount)}
      <div class="rule"></div>
      <div class="tokenbar">
        <label>TOKEN</label>
        <span class="pill ok" style="flex:1;justify-content:flex-start"><span class="dot"></span>stored in this browser</span>
        <button class="btn sm ghost" onClick=${clearToken}>Sign out</button>
      </div>
      <div class="tabs">
        ${TABS.map(([id,label])=>html`
          <button key=${id} class=${"tab"+(tab===id?" active":"")} onClick=${()=>setTab(id)}>
            ${label}${id==="approvals" && pendingCount>0 && html`<span class="badge">${pendingCount}</span>`}
          </button>`)}
      </div>
      ${panel}
      ${toast && html`<div class=${"toast "+toast.kind}>${toast.msg}</div>`}
    </div>`;
}

function Header(health,pending,version){
  const cls = health===true?"pill ok":health===false?"pill bad":"pill";
  const label = health===true?"ONLINE":health===false?"OFFLINE":"—";
  return html`
    <div class="top">
      <div class="brand">
        <div class="logo">AR<b>E</b>S</div>
        <div class="tagline">agentic runtime</div>
      </div>
      <div class="hmeta">
        <span class="ver" title=${version?("deployed commit "+version):"version unknown"}>${version?("build "+version):"build —"}</span>
        <div class=${cls}><span class="dot"></span>${label}</div>
      </div>
    </div>`;
}

render(html`<${App}/>`, document.getElementById("app"));
</script>
</body>
</html>
